<style>
    :root{
    --bg:#000000;           /* Pure black background */
    --bg-card:#111111;      /* Dark card background */
    --bg-card-hover:#1a1a1a;
    --border:#222222;
    --text:#ffffff;
    --text-dim:#a0a0a0;
    --accent:#ff9900;       /* Iconic orange accent */
    --accent-glow:#ff990033;
    --download-btn:#ff9900; /* Button color */
    --radius:10px;
  }


  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  a{color:inherit; text-decoration:none;}
  img, video{max-width:100%; display:block;}

  header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(10,10,12,0.92);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .logo{font-size:20px; font-weight:800; letter-spacing:0.5px;}
  .logo span{color:var(--accent);}

  .search-icon{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
    border-radius:50%;
    color:var(--text-dim);
    font-size:16px;
  }

  .hero{padding:20px 16px 6px;}
  .hero h1{font-size:22px; font-weight:800;}
  .hero p{color:var(--text-dim); font-size:13px; margin-top:4px;}

  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 16px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:7px 16px;
    border-radius:999px;
    background:var(--bg-card);
    border:1px solid var(--border);
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    box-shadow:0 0 14px var(--accent-glow);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    padding:8px 16px 16px;
  }

  @media(min-width:520px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1280px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:active{transform:scale(0.98);}

  .video-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
  }

  video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
  }

  .duration-badge{
    position:absolute;
    bottom:8px;
    right:8px;
    background:rgba(0,0,0,0.75);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:2px 6px;
    border-radius:4px;
    pointer-events:none;
    z-index:2;
  }

  .hd-badge{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--accent);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    letter-spacing:0.5px;
    pointer-events:none;
    z-index:2;
  }

  .card-info{padding:12px;}
  .card-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card-meta{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-dim);
    font-size:12px;
    margin-top:6px;
  }
  .card-meta .dot{width:3px; height:3px; background:var(--text-dim); border-radius:50%;}

  .card-actions{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
  }

  .download-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--download-btn);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:9px 10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    text-decoration: none;
  }
  .download-btn svg{width:16px; height:16px; flex:0 0 auto;}

  .like-btn{
    flex:0 0 auto;
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
  }
  .like-btn.liked{color:var(--accent); border-color:var(--accent);}

  /* Loader spinner for infinite scroll */
  #infiniteLoader{
    text-align:center;
    padding:20px;
    color:var(--text-dim);
    font-size:13px;
  }

  footer{
    text-align:center;
    padding:30px 16px 10px;
    color:var(--text-dim);
    font-size:12px;
    border-top:1px solid var(--border);
    margin-top:20px;
  }
  footer a{color:var(--accent2);}
</style>

  const DOWNLOAD_ICON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';

  let itemsPerPage = 8;
  let currentIndex = 0;
  let currentCategory = 'all';
  let filteredVideos = VIDEOS;

  function buildCard(video){
    const durationBadge = video.duration ? `<span class="duration-badge">${escapeHTML(video.duration)}</span>` : '';

    const article = document.createElement('article');
    article.className = 'card';
    article.innerHTML = `
      <div class="video-wrap">
        <span class="hd-badge">HD</span>
        ${durationBadge}
        <video controls preload="metadata" playsinline>
          <source src="${escapeHTML(video.src)}" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="card-info">
        <h2 class="card-title">${escapeHTML(video.title)}</h2>
        <div class="card-meta">
          <span>${escapeHTML(video.views)}</span>
          <span class="dot"></span>
          <span>${escapeHTML(video.time)}</span>
        </div>
        <div class="card-actions">
          <a class="download-btn" href="${escapeHTML(video.src)}" download target="_blank" rel="noopener">
            ${DOWNLOAD_ICON_SVG}
            Download
          </a>
          <button class="like-btn" onclick="toggleLike(this)">  </button>
        </div>
      </div>
    `;
    return article;
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  function loadMoreVideos() {
    if (currentIndex >= filteredVideos.length) {
      document.getElementById('infiniteLoader').style.display = 'none';
      return;
    }

    const grid = document.getElementById('videoGrid');
    const nextBatch = filteredVideos.slice(currentIndex, currentIndex + itemsPerPage);
    
    nextBatch.forEach(video => {
      grid.appendChild(buildCard(video));
    });

    currentIndex += itemsPerPage;

    if (currentIndex >= filteredVideos.length) {
      document.getElementById('infiniteLoader').textContent = "No more videos to load";
    } else {
      document.getElementById('infiniteLoader').style.display = 'block';
      document.getElementById('infiniteLoader').textContent = "Loading more videos...";
    }
  }

  // Intersection Observer for Infinite Scrolling
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        loadMoreVideos();
      }
    });
  }, { rootMargin: '200px' });

  observer.observe(document.getElementById('infiniteLoader'));

  // Category Filtering Logic
  document.querySelectorAll('#categoryChips .chip').forEach(chip => {
    chip.addEventListener('click', function() {
      document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.remove('active'));
      this.classList.add('active');

      currentCategory = this.getAttribute('data-category');
      
      if (currentCategory === 'all') {
        filteredVideos = VIDEOS;
      } else {
        filteredVideos = VIDEOS.filter(v => v.category === currentCategory);
      }

      currentIndex = 0;
      document.getElementById('videoGrid').innerHTML = '';
      loadMoreVideos();
    });
  });

  function toggleLike(btn){
    btn.classList.toggle('liked');
  }

  // Ensure only one video plays at a time
  document.addEventListener('play', function(e){
    if (e.target.tagName !== 'VIDEO') return;
    document.querySelectorAll('video').forEach(function(v){
      if (v !== e.target) v.pause();
    });
  }, true);
</script>
